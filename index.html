<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mühendislik ve matematik kavramlarının etkileşimli görselleştirmeleri." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%233b5bdb' stroke-width='3'/%3E%3Ccircle cx='28' cy='16' r='3' fill='%23e8590c'/%3E%3C/svg%3E" />
    <title>Engineering Atlas</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('atlas-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
